<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sit-Say Par - URL အန္တရာယ်စစ်ဆေးခြင်း</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Sit-Say Par</h1>
            <p class="text-gray-500 mt-2">
                သံသယဖြစ်စရာ link များကို မနှိပ်ခင် အန္တရာယ်ရှိမရှိ စစ်ဆေးပါ။ စာသားနှင့် link ရောနေလည်း စိတ်မပူပါနှင့် — စနစ်က အလိုအလျောက် ရှာဖွေပေးပါမည်။
            </p>
        </div>

        <form action="/analyze-web" method="post" class="space-y-4">
            <input type="text" name="url"
                   placeholder="link (http:// သို့ https:// သို့ စာသားတစ်ခုလုံး)ကို ဒီမှာ paste လုပ်ပါ"
                   required
                   class="w-full px-5 py-6 text-xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200">
                စစ်ဆေးမည်
            </button>
        </form>

        {% if error %}
            <div class="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
                {{ error }}
            </div>
        {% endif %}

        <div class="mt-6 text-center">
            <a href="/history" class="text-blue-600 hover:underline text-sm">
                စစ်ဆေးမှုမှတ်တမ်းကြည့်ရန်
            </a>
        </div>
    </div>

 <!-- index.html footer --> 
    <footer class="mt-6 text-center text-sm text-gray-500">
        <p>အကူအညီလိုအပ်ပါက 
            <a href="mailto:sitsaypar@gmail.com" class="text-blue-600 hover:underline">sitsaypar@gmail.com</a> သို့ ဆက်သွယ်ပါ။
        </p>
    </footer>

</body>
</html>
