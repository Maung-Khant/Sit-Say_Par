<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <title>စစ်ဆေးမှုရလဒ် - Sit-Say Par</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 2em auto;
            padding: 1em;
            background: #f8f9fa;
        }
        h1 { color: #2c3e50; }
        .score { font-size: 2em; font-weight: bold; }
        .level-low { color: green; }
        .level-medium { color: orange; }
        .level-high { color: red; }
        .level-critical { color: darkred; }
        .confidence-high { color: green; font-weight: bold; }
        .confidence-medium { color: orange; }
        .confidence-low { color: gray; }
        pre {
            white-space: pre-wrap;
            background: #fff;
            padding: 1em;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .back-link { margin-top: 1em; display: block; }

        /* Gauge styles */
        .gauge-container {
            display: flex;
            align-items: center;
            gap: 1em;
            margin: 1em 0;
        }
        .gauge {
            width: 120px;
            height: 60px;
            position: relative;
            overflow: hidden;
        }
        .gauge .meter {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(
                green 0deg,
                orange 90deg,
                red 180deg,
                darkred 270deg,
                #eee 360deg
            );
            transform: rotate(calc(var(--gauge-rotation, -90deg)));
            mask: radial-gradient(transparent 55%, black 60%);
        }
        .gauge .label {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>စစ်ဆေးမှုရလဒ်</h1>
    <p>URL: <strong>{{ url }}</strong></p>

    <div class="gauge-container">
        <div>
            <p>အန္တရာယ်ရှိမှုအဆင့်:
                <span class="score level-{{ risk_level.lower() }}">{{ risk_level }}</span>
            </p>
            <p>ရမှတ်: {{ risk_score }}/100</p>
            <p>ယုံကြည်စိတ်ချရမှု အဆင့်:
                <span class="confidence-{{ confidence.lower() }}">{{ confidence }}</span>
            </p>
        </div>
        <div class="gauge" style="--gauge-rotation: {{ (risk_score * 3.6 - 90) }}deg;">
            <div class="meter"></div>
            <div class="label">{{ risk_score }}%</div>
        </div>
    </div>

    <h2>အကြောင်းပြချက်</h2>
    <pre>{{ explanation }}</pre>

    <a href="/" class="back-link">← နောက်ထပ် URL တစ်ခုစစ်ဆေးရန်</a>
</body>
</html>
