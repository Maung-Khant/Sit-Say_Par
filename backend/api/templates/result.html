<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စစ်ဆေးမှုရလဒ် - Sit-Say Par</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .level-low { color: #16a34a; }
        .level-medium { color: #ea580c; }
        .level-high { color: #dc2626; }
        .level-critical { color: #991b1b; }
        .confidence-high { color: #16a34a; }
        .confidence-medium { color: #ea580c; }
        .confidence-low { color: #6b7280; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">စစ်ဆေးမှုရလဒ်</h1>

        <div class="mb-4">
            <span class="text-sm text-gray-500">URL:</span>
            <p class="text-lg font-medium text-gray-700 break-all">{{ url }}</p>
        </div>

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-6">
            <div class="flex-1 space-y-3">
                <div>
                    <span class="text-sm text-gray-500">အန္တရာယ်ရှိမှုအဆင့်:</span>
                    <span class="text-2xl font-bold level-{{ risk_level.lower() }}">{{ risk_level }}</span>
                </div>
                <div>
                    <span class="text-sm text-gray-500">ရမှတ်:</span>
                    <span class="text-2xl font-bold text-gray-800">{{ risk_score }}/100</span>
                </div>
                <div>
                    <span class="text-sm text-gray-500">စနစ်၏ စစ်ဆေးမှု သေချာမှု:</span>
                    <span class="font-semibold confidence-{{ detection_confidence.lower() }}">{{ detection_confidence }}</span>
                </div>
            </div>

            <div class="flex-shrink-0 relative w-32 h-32 mx-auto md:mx-0">
                <svg class="w-full h-full" viewBox="0 0 36 36">
                    <path d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831"
                          fill="none" stroke="#e5e7eb" stroke-width="3" />
                    <path d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831"
                          fill="none"
                          stroke="{% if risk_level == 'Low' %}#16a34a{% elif risk_level == 'Medium' %}#ea580c{% elif risk_level == 'High' %}#dc2626{% else %}#991b1b{% endif %}"
                          stroke-width="3"
                          stroke-dasharray="{{ risk_score }}, 100"
                          stroke-linecap="round" />
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-xl font-bold text-gray-700">{{ risk_score }}%</span>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 rounded-lg p-4 mb-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-2">အကြောင်းပြချက်</h2>
            <pre class="whitespace-pre-wrap text-sm text-gray-600 font-sans">{{ explanation }}</pre>
        </div>

        <div class="text-center">
            <a href="/" class="text-blue-600 hover:underline text-sm">
                ← နောက်ထပ် URL တစ်ခုစစ်ဆေးရန်
            </a>
        </div>
    </div>
</body>
</html>
